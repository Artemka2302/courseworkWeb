version: '3.8'

services:
  web:
    build: .
    container_name: taskmaster_app
    ports:
      - "5000:5000"
    volumes:
      # Volume для базы данных (SQLite) — данные НЕ ПРОПАДУТ
      - ./instance:/app/instance
      # Volume для загруженных файлов — файлы НЕ ПРОПАДУТ
      - ./uploads:/app/uploads
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
    restart: unless-stopped