<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <style>
        body { font-family: sans-serif; margin: 40px; line-height: 1.6; }
        .container { max-width: 600px; margin: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Привет, мир!</h1>
        <p>{{ title }}</p>
        
        <h2>Список технологий в проекте:</h2>
        <ul>
            {% for item in items %}
                <li>{{ item }}</li>
            {% endfor %}
        </ul>
        
        <hr>
        <p>
            <strong>Фильтр:</strong> 
            {{ 'flask jinja site' | upper }}
        </p>
    </div>
</body>
</html>
